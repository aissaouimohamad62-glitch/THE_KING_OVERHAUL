    may: { id: 'may', days: { 0: campWDay(), 1: campWDay(), 2: campWDay(), 3: campWDay(), 4: campWDay(), 5: campWDay(), 6: campWDay() } },
    jun: { id: 'jun', days: { 0: campWDay(), 1: campWDay(), 2: campWDay(), 3: campWDay(), 4: campWDay(), 5: campWDay(), 6: campWDay() } }
};

const Utils = {
    getDayName(idx) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        return days[idx];
    }
};

const PlayerSync = {
    data: { level: 1, xp: 0 },
    init() {
        this.load();
        this.updateUI();
        if (window.SovereignCore) {
            SovereignCore.onChange(() => {
                this.load();
                this.updateUI();
            });
        }
    },
    load() {
        try {
            const saved = window.SovereignCore ? SovereignCore.data : JSON.parse(localStorage.getItem('monarch_system_data') || '{}');
            this.data.level = saved.level || 1;
            this.data.xp = saved.xp || 0;
        } catch(e) {}
    },
    updateUI() {
        const lvlEl = document.getElementById('player-level');
        const barEl = document.getElementById('player-xp-bar');
        if(lvlEl) lvlEl.textContent = this.data.level;
        if(barEl) {
            const needed = this.data.level * 100;
            const pct = Math.min((this.data.xp / needed) * 100, 100);
            barEl.style.width = `${pct}%`;
        }
    }
};

const Charter = {
    activeProgramId: 'oct',

    init() {
        PlayerSync.init();
        this.generateButtons();
        
        const saved = localStorage.getItem('sovereign_bac_month');
        const validIds = Object.keys(PROGRAM_DATA);
        this.activeProgramId = (saved && validIds.includes(saved)) ? saved : 'oct';
        
        this.switch(this.activeProgramId);
    },

    generateButtons() {
        const monthConfigs = [
            { id: 'oct', color: 'cyan', title: '🍂 OCTOBER', sub: 'Routine Establishment & BAC Rules', badge: 'PHASE 1', darkHex: '6, 182, 212', mainHex: '#22d3ee' },
            { id: 'nov', color: 'cyan', title: '🌧️ NOVEMBER', sub: 'Artificial Intelligence & Total Power', badge: 'PHASE 1', darkHex: '6, 182, 212', mainHex: '#22d3ee' },
            { id: 'dec', color: 'cyan', title: '❄️️ DECEMBER', sub: 'Cybersecurity & Review', badge: 'PHASE 1', darkHex: '6, 182, 212', mainHex: '#22d3ee' },
            { id: 'jan', color: 'purple', title: '🎯 JANUARY', sub: 'Cognitive Memory Peak', badge: 'PHASE 2', darkHex: '168, 85, 247', mainHex: '#c084fc' },
            { id: 'feb', color: 'purple', title: '🥊 FEBRUARY', sub: 'Combat & Mental Tactics', badge: 'PHASE 2', darkHex: '168, 85, 247', mainHex: '#c084fc' },
            { id: 'mar', color: 'purple', title: '🌱 MARCH CAMP', sub: 'Intensive Review Bootcamp Initiation', badge: 'PHASE 2', darkHex: '168, 85, 247', mainHex: '#c084fc' },
            { id: 'apr', color: 'emerald', title: '💧 APRIL CAMP', sub: 'Deep Application Bootcamp', badge: 'PHASE 3', darkHex: '16, 185, 129', mainHex: '#34d399' },
            { id: 'may', color: 'emerald', title: '🔥 MAY CAMP', sub: 'Isolation & Total Disconnection Bootcamp', badge: 'PHASE 3', darkHex: '16, 185, 129', mainHex: '#34d399' },
            { id: 'jun', color: 'rose', title: '⚔️ JUNE FINAL', sub: 'Warrior Rest & Final Touches', badge: 'BAC 2027', darkHex: '225, 29, 72', mainHex: '#fb7185' }
        ];

        let html = '';
        monthConfigs.forEach(m => {
            html += `
            <button onclick="Charter.switch('${m.id}')" id="btn-${m.id}" class="sov-month-btn w-full text-left p-4 rounded flex justify-between items-center group" data-color="${m.color}" style="
                position: relative; background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
                border: 1px solid rgba(${m.darkHex}, 0.15); border-radius: 12px; transition: all 0.4s ease; overflow: hidden; box-shadow: 0 4px 20px rgba(${m.darkHex}, 0.05);
            " onmouseover="if(!this.dataset.active){this.style.transform='translateY(-3px) scale(1.01)'; this.style.borderColor='rgba(${m.darkHex}, 0.6)'; this.style.boxShadow='0 10px 40px rgba(${m.darkHex}, 0.25), 0 0 30px rgba(${m.darkHex}, 0.15), inset 0 1px 0 rgba(${m.darkHex}, 0.2)';}" onmouseout="if(!this.dataset.active){this.style.transform=''; this.style.borderColor='rgba(${m.darkHex}, 0.15)'; this.style.boxShadow='0 4px 20px rgba(${m.darkHex}, 0.05)';}">
                <div class="orb" style="position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(${m.darkHex}, 0.15) 0%, transparent 70%); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; opacity: 0; transition: opacity 0.4s ease;"></div>
                <div style="position: relative; z-index: 3;" dir="ltr">
                    <span class="btn-title sys-font text-sm font-black text-white block uppercase" style="transition: all 0.3s ease; text-shadow: 0 0 5px rgba(${m.darkHex}, 0.2);">${m.title}</span>
                    <span class="btn-sub text-[10px] text-slate-400 block mt-1" style="transition: all 0.3s ease;">${m.sub}</span>
                </div>
                <span class="btn-badge sys-font text-[10px] px-2 py-0.5 border" style="position: relative; transition: all 0.3s ease; border-color: rgba(${m.darkHex}, 0.5); color: ${m.mainHex}; text-shadow: 0 0 8px rgba(${m.darkHex}, 0.6);">${m.badge}</span>
            </button>`;
        });
        document.getElementById('months-grid').innerHTML = html;
    },

    switch(id) {
        this.activeProgramId = id;
        localStorage.setItem('sovereign_bac_month', id);
        
        const monthConfigs = {
            'oct': { main: '34, 211, 238', dark: '6, 182, 212', hex: '#22d3ee' },
            'nov': { main: '34, 211, 238', dark: '6, 182, 212', hex: '#22d3ee' },
            'dec': { main: '34, 211, 238', dark: '6, 182, 212', hex: '#22d3ee' },
            'jan': { main: '192, 132, 252', dark: '168, 85, 247', hex: '#c084fc' },
            'feb': { main: '192, 132, 252', dark: '168, 85, 247', hex: '#c084fc' },
            'mar': { main: '192, 132, 252', dark: '168, 85, 247', hex: '#c084fc' },
            'apr': { main: '52, 211, 153', dark: '16, 185, 129', hex: '#34d399' },
            'may': { main: '52, 211, 153', dark: '16, 185, 129', hex: '#34d399' },
            'jun': { main: '251, 113, 133', dark: '225, 29, 72', hex: '#fb7185' }
        };

        Object.keys(monthConfigs).forEach(btnId => {
            const btn = document.getElementById(`btn-${btnId}`);
            if(!btn) return;
            const c = monthConfigs[btnId];
            
            if (btnId === id) {
                btn.dataset.active = '1';
                btn.style.borderColor = `rgba(${c.main}, 0.9)`;
                btn.style.boxShadow = `0 0 20px rgba(${c.main}, 0.4), inset 0 0 20px rgba(${c.main}, 0.15)`;
                btn.style.background = `linear-gradient(145deg, rgba(${c.dark}, 0.15), rgba(15, 23, 42, 0.95))`;
                btn.querySelector('.orb').style.opacity = '0.6';
                btn.querySelector('.btn-title').style.color = c.hex;
                btn.querySelector('.btn-title').style.textShadow = `0 0 15px rgba(${c.main}, 1)`;
                btn.querySelector('.btn-sub').style.color = c.hex;
                btn.querySelector('.btn-badge').style.background = `rgba(${c.dark}, 0.2)`;
            } else {
                delete btn.dataset.active;
                btn.style.borderColor = `rgba(${c.dark}, 0.15)`;
                btn.style.boxShadow = `0 4px 20px rgba(${c.dark}, 0.05)`;
                btn.style.background = 'linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9))';
                btn.querySelector('.orb').style.opacity = '0';
                btn.querySelector('.btn-title').style.color = '';
                btn.querySelector('.btn-title').style.textShadow = `0 0 5px rgba(${c.dark}, 0.2)`;
                btn.querySelector('.btn-sub').style.color = '';
                btn.querySelector('.btn-badge').style.background = 'transparent';
            }
        });

        this.renderToday();
        this.renderFullWeek();
    },

    renderToday() {
        const container = document.getElementById('today-schedule-container');
        const dayLabel = document.getElementById('current-day-label');
        const prog = PROGRAM_DATA[this.activeProgramId];
        if (!prog || !container) return;

        const now = new Date();
        const day = now.getDay();
        const currentHourDec = now.getHours() + now.getMinutes() / 60;

        if (dayLabel) dayLabel.textContent = Utils.getDayName(day);

        const blocks = prog.days[day] || [];
        let html = '';
        let activeFound = false;

        blocks.forEach(block => {
            let isActive = false;
            if (block.start > block.end) {
                isActive = !activeFound && (currentHourDec >= block.start || currentHourDec < block.end);
            } else {
                isActive = !activeFound && currentHourDec >= block.start && currentHourDec < block.end;
            }
            if (isActive) activeFound = true;
            
            const activeClass = isActive ? 'block-active live-pulse' : 'bg-slate-950/40 border-slate-800';
            const titleColor = isActive ? 'text-[var(--sys-cyan)]' : 'text-slate-300';
            const icon = isActive ? '<span class="text-[var(--sys-cyan)] animate-pulse">●</span>' : '<span class="text-slate-700">○</span>';
            
            html += `
            <div class="p-3 rounded border ${activeClass} mb-2 transition-all" dir="ltr">
                <div class="flex justify-between items-start mb-1">
                    <div class="flex items-center gap-2">${icon}<span class="font-bold text-sm ${titleColor}">${block.title}</span></div>
                    <span class="sys-font text-[10px] text-slate-500 bg-black/40 px-1.5 py-0.5 rounded ml-2" dir="ltr">${block.timeStr}</span>
                </div>
                <p class="text-[11px] text-slate-400 leading-relaxed pl-5">${block.desc}</p>
                ${isActive ? '<div class="mt-2 flex items-center gap-2 pl-5"><span class="text-[9px] sys-font text-emerald-400 bg-emerald-950/30 px-2 py-0.5 rounded border border-emerald-500/30">Active Block</span></div>' : ''}
            </div>`;
        });
        
        container.innerHTML = html;
    },

    renderFullWeek() {
        const container = document.getElementById('full-week-container');
        const prog = PROGRAM_DATA[this.activeProgramId];
        if (!prog || !container) return;

        let html = '';
        const dayConfigs = [
            { border: 'border-t-amber-500', icon: '🏛️' },
            { border: 'border-t-emerald-500', icon: '🌙' },
            { border: 'border-t-blue-500', icon: '🚀' },
            { border: 'border-t-indigo-500', icon: '🧠' },
            { border: 'border-t-rose-500', icon: '🕌' },
            { border: 'border-t-[var(--sys-purple)]', icon: '🎨' },
            { border: 'border-t-[var(--sys-cyan)]', icon: '🛡️' }
        ];

        [0, 1, 2, 3, 4, 5, 6].forEach(dayIdx => {
            const blocks = prog.days[dayIdx] || [];
            const config = dayConfigs[dayIdx];
            
            html += `
            <div class="sl-panel p-5 border-t-4 ${config.border} mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-2xl">${config.icon}</span>
                    <h3 class="text-lg font-black text-white uppercase">${Utils.getDayName(dayIdx)}</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${blocks.map(b => `
                        <div class="bg-slate-950/60 p-3 rounded border border-slate-800 hover:border-slate-600 transition">
                            <div class="text-[10px] sys-font text-[var(--sys-cyan)] mb-2 bg-black/40 inline-block px-2 py-0.5 rounded" dir="ltr">${b.timeStr}</div>
                            <h4 class="text-sm font-bold text-white mb-1">${b.title}</h4>
                            <p class="text-[11px] text-slate-400 leading-relaxed">${b.desc}</p>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        });
        
        container.innerHTML = html;
    }
};

document.addEventListener('DOMContentLoaded', () => {
    Charter.init();
    setInterval(() => Charter.renderToday(), 60000);
});
</script>
</body>
</html>
